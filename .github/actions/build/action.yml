name: Build
description: "Download dependencies, compile and cache"

runs:
  using: "composite"

  steps:
    - name: Setup BEAM
      uses: erlef/setup-beam@v1
      id: setup-beam
      with:
        version-type: strict
        version-file: .tool-versions

    - name: Cache Elixir dependencies
      uses: actions/cache@v4
      id: cache-elixir-deps
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}

    - name: Cache compiled build
      uses: actions/cache@v4
      id: cache-build
      with:
        path: _build
        key: ${{ runner.os }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-build-${{ hashFiles('**/mix.exs') }}
        restore-keys: ${{ runner.os }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-build-

    - name: Install Elixir dependencies
      if: steps.cache-elixir-deps.outputs.cache-hit != 'true'
      shell: bash
      run: mix deps.get

    - name: Set MIX_OS_DEPS_COMPILE_PARTITION_COUNT
      if: runner.os == 'Linux'
      shell: bash
      run: echo "MIX_OS_DEPS_COMPILE_PARTITION_COUNT=$(nproc)" >> $GITHUB_ENV

    - name: Compiles without warnings
      shell: bash
      run: mix compile
